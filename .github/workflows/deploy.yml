name: Deploy ke Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek token Cloudflare
        id: cek
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ada=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret CLOUDFLARE_API_TOKEN belum diisi, deploy dilewati"
          else
            echo "ada=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy (wrangler)
        if: steps.cek.outputs.ada == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
